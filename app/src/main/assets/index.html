aside{position:fixed;top:0;bottom:0;right:0;width:min(86vw,340px);background:var(--card);border-left:1px solid var(--line);z-index:6;transform:translateX(105%);transition:transform .25s;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}

aside h2{margin:0;font-size:18px}
aside label{font-size:14px;color:var(--muted);display:block;margin-bottom:4px}
aside select{width:100%;font:inherit;padding:9px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
hr{border:0;border-top:1px solid var(--line);width:100%;margin:2px 0}

["طبل معدني","بيانو ومفاتيح",[1,.5],{a:.003,dec:.9,s:.005,b0:8,b1:3,r:.15,ip:[[2,.4],[3,.2]]}],
// سينث وكلاكس

["كلاكس شاحنة","سينث وكلاكس",S(10,.8),{a:.02,s:1,b0:5,b1:5,r:.06,det:[0,386],vol:.8}],
["كلاكس هوائي","سينث وكلاكس",S(12,.6),{a:.03,s:1,b0:5,b1:5,q:1.5,r:.12,det:[0,386,702],vol:.7}]
];
const PRESETS=RAW.map(([n,g,h,o])=>({n,g,h,...D,...o}));
// داخل تطبيق الأندرويد يُستخدم المحرك الصوتي الأصيل (أسرع)؛ وفي المتصفح يُستخدم Web Audio
const NATIVE=!!(window.Native&&window.Native.noteOn);
if(NATIVE){try{Native.setPresets(JSON.stringify(PRESETS));Native.setVolume(+$("vol").value);}catch(e){}}

// ===== محرك الصوت =====
let ctx,master,noiseBuf;
function ensureAudio(){
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ctx.createDynamicsCompressor();
    master=ctx.createGain();master.gain.value=+$("vol").value;
    master.connect(comp);comp.connect(ctx.destination);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
    const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
  }
  if(ctx.state==="suspended")ctx.resume();
}
const waves=new Map();
function waveOf(p){
  if(!waves.has(p)){const im=new Float32Array(p.h.length+1);p.h.forEach((v,i)=>im[i+1]=v);
    waves.set(p,ctx.createPeriodicWave(new Float32Array(im.length),im));}
  return waves.get(p);
}
function startVoice(f,p){
  const t=ctx.currentTime,all=[];
  const amp=ctx.createGain();amp.gain.setValueAtTime(0.0001,t);
  amp.gain.exponentialRampToValueAtTime(p.vol,t+p.a);
  amp.gain.exponentialRampToValueAtTime(Math.max(p.s*p.vol,0.0002),t+p.a+p.dec);
  const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.Q.value=p.q;
  lp.frequency.setValueAtTime(Math.min(f*p.b0,18000),t);
  lp.frequency.exponentialRampToValueAtTime(Math.min(f*p.b1,18000),t+p.a+p.fa);
  const oscs=p.det.map(c=>{const o=ctx.createOscillator(),v=ctx.createGain();
    o.setPeriodicWave(waveOf(p));o.frequency.value=f;o.detune.value=c;
    v.gain.value=.4/Math.sqrt(p.det.length);o.connect(v);v.connect(lp);o.start(t);all.push(o);return o;});
  if(p.ip)p.ip.forEach(([r,g])=>{const o=ctx.createOscillator(),v=ctx.createGain();
    o.frequency.value=f*r;v.gain.setValueAtTime(g*.4,t);
    v.gain.exponentialRampToValueAtTime(0.0005,t+p.a+p.dec*.6);o.connect(v);v.connect(amp);o.start(t);all.push(o);});
  if(p.vib){const lfo=ctx.createOscillator(),lg=ctx.createGain();
    lfo.frequency.value=p.vr;lg.gain.setValueAtTime(0,t+p.vd);lg.gain.linearRampToValueAtTime(p.vib,t+p.vd+.4);
    lfo.connect(lg);oscs.forEach(o=>lg.connect(o.detune));lfo.start(t);all.push(lfo);}
  if(p.nz){const n=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),g=ctx.createGain();
    n.buffer=noiseBuf;n.loop=true;bp.type="bandpass";bp.frequency.value=Math.min(f*2,8000);bp.Q.value=.8;
    g.gain.value=p.nz;n.connect(bp);bp.connect(g);g.connect(amp);n.start(t);all.push(n);}
  lp.connect(amp);amp.connect(master);
  return{stop(){const n=ctx.currentTime;amp.gain.cancelScheduledValues(n);
    amp.gain.setValueAtTime(Math.max(amp.gain.value,0.0002),n);
    amp.gain.exponentialRampToValueAtTime(0.0001,n+p.r);
    all.forEach(o=>o.stop(n+p.r+.05));}};
}

// ===== الواجهة =====
const disc=$("disc"),keys=[];
for(let i=2;i>=0;i--){const b=document.createElement("button");b.className="key";b.dataset.i=i;b.setAttribute("aria-label","زر "+(i+1));disc.appendChild(b);keys[i]=b;}
function fillDegrees(){
  for(let i=0;i<3;i++){const s=$("k"+(i+1));
    s.innerHTML=Array.from({length:10},(_,d)=>`<option value="${d}">${noteName(d)}${d>=5?" (أعلى)":""}</option>`).join("");
    s.value=state.deg[i];}
}
$("root").innerHTML=NAMES.map((n,i)=>`<option value="${i}">${n}</option>`).join("");$("root").value=state.root;
$("root").onchange=e=>{state.root=+e.target.value;fillDegrees()};
[1,2,3].forEach(n=>$("k"+n).onchange=e=>{state.deg[n-1]=+e.target.value;fillDegrees()});
fillDegrees();
const groups={};PRESETS.forEach((p,i)=>(groups[p.g]=groups[p.g]||[]).push(`<option value="${i}">${p.n}</option>`));
$("pre").innerHTML=Object.entries(groups).map(([g,o])=>`<optgroup label="${g}">${o.join("")}</optgroup>`).join("");
$("pre").value=state.preset;$("pre").onchange=e=>state.preset=+e.target.value;
$("oct").innerHTML=["منخفض (غليظ)","متوسط","عالٍ","عالٍ جداً"].map((n,i)=>`<option value="${i}">${n}</option>`).join("");
$("oct").value=state.oct;$("oct").onchange=e=>state.oct=+e.target.value;
$("vol").oninput=e=>{if(master)master.gain.value=+e.target.value;if(NATIVE)Native.setVolume(+e.target.value);};

// القائمة الجانبية
const side=$("side"),scrim=$("scrim");
const setSide=o=>{side.classList.toggle("open",o);scrim.classList.toggle("open",o);};
$("menu").onclick=()=>setSide(true);$("close").onclick=()=>setSide(false);scrim.onclick=()=>setSide(false);
window.handleBack=()=>{if(side.classList.contains("open")){setSide(false);return true;}return false;};

// التحكم: الصوت يتبع مكان المؤشر/الإصبع
const active=new Map();
function press(id,i){if(active.has(id))return;let v;if(NATIVE){Native.noteOn(id,freqOf(state.deg[i]),state.preset);v={stop(){Native.noteOff(id)}};}else{ensureAudio();v=startVoice(freqOf(state.deg[i]),PRESETS[state.preset]);}active.set(id,{i,v});keys[i].classList.add("on");}
function release(id){const a=active.get(id);if(!a)return;a.v.stop();active.delete(id);
  if(![...active.values()].some(x=>x.i===a.i))keys[a.i].classList.remove("on");}
let unlocked=false;const ptr=new Map();
// تحديد الزر بالهندسة: منطقة أوسع قليلاً من الزر حتى لا ينقطع الصوت عند الانزلاق
let geo=[];
function calcGeo(){geo=keys.map(k=>{const r=k.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,r:r.width/2};});}
addEventListener("resize",calcGeo);addEventListener("load",calcGeo);calcGeo();
const hit=e=>{if(side.classList.contains("open"))return -1;let best=-1,bd=1e9;
  geo.forEach((g,i)=>{const dd=Math.hypot(e.clientX-g.x,e.clientY-g.y);if(dd<=g.r*1.5&&dd<bd){bd=dd;best=i;}});return best;};
const engaged=e=>e.pointerType==="mouse"?((e.buttons&1)||($("hv").checked&&unlocked)):(e.buttons&1);
function update(e){
  const id="p"+e.pointerId,cur=ptr.has(id)?ptr.get(id):-1,i=engaged(e)?hit(e):-1;
  if(i===cur)return;
  if(cur>-1)release(id);
  if(i>-1)press(id,i);
  ptr.set(id,i);
}
function stopPtr(e){const id="p"+e.pointerId;release(id);ptr.set(id,-1);}
addEventListener("pointerdown",e=>{
  unlocked=true;if(!NATIVE)ensureAudio();
  if(e.target.hasPointerCapture&&e.target.hasPointerCapture(e.pointerId))e.target.releasePointerCapture(e.pointerId);
  if(e.target.closest&&e.target.closest(".disc"))e.preventDefault();
  update(e);
});
addEventListener("pointermove",update);
addEventListener("pointerup",e=>{if(e.pointerType==="mouse")update(e);else stopPtr(e);});
addEventListener("pointercancel",stopPtr);
addEventListener("pointerout",e=>{if(!e.relatedTarget)stopPtr(e);});
addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("keydown",e=>{if(e.repeat)return;const i="123".indexOf(e.key);if(i>-1){unlocked=true;press("k"+e.key,i);}});
addEventListener("keyup",e=>{if("123".includes(e.key))release("k"+e.key);});
addEventListener("blur",()=>[...active.keys()].forEach(release));
</script>
</body>
</html>
